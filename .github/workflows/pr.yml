name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: media-license
      dev-plugin-name: Media License (DEV)
      # Requires PHP: 8.0 - classes/Render.php declares a union type
      php-versions: '["8.0", "8.1", "8.2", "8.3", "8.4"]'
      # public/dist is not in the repository; the pipeline builds it
      build-command: npm ci && npm run build
      # what the plugin enqueues, so a renamed entry point fails here instead of
      # 404ing in wp-admin or on the front end
      required-files: |
        vendor/autoload.php
        dist/media-license.js
        dist/media-license.asset.php
        js/api.js
        js/admin-textarea-toolbar.js
        styles/frontend.css
        templates/media-license-caption.tpl.php
        languages/media-license.pot
        languages/media-license-de_DE.mo
