---
version: 2

# No composer entry: public/composer.json declares no requirements at all, only the
# PSR-4 autoload mapping, so there is nothing for Dependabot to bump. bin/pack.sh
# regenerates the autoloader at pack time.
updates:
  - package-ecosystem: "npm"
    assignees:
      - "JanaME"
    commit-message:
      prefix: "deps"
      include: "scope"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"

  # Has to be "/" - that is what makes Dependabot read .github/workflows/. A path
  # like /.github/ is understood as the location of a composite action instead, and
  # workflow files are then never checked.
  - package-ecosystem: "github-actions"
    assignees:
      - "JanaME"
    commit-message:
      prefix: "deps"
      include: "scope"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
